# ACT 权重本地实机部署与推理配置（脱敏模板）
# 注意：在 LeRobot v0.4 (draccus) 下若使用命令行覆盖，请务必使用等号赋值与全小写 true/false。

robot:
  type: so101_follower
  port: "${FOLLOWER_PORT}"
  id: "${FOLLOWER_ID}"
  cameras:
    cam_high:
      type: opencv
      index_or_path: 2
      width: 640
      height: 480
      fps: 30
    cam_wrist:
      type: opencv
      index_or_path: 0
      width: 640
      height: 480
      fps: 30

policy:
  type: act
  pretrained_path: "${MODEL_DIR}/pretrained_model"
  device: cuda

dataset:
  repo_id: "${HF_USER}/eval_wiping_run"
  single_task: "wipe the board"
  episode_time_s: 120
  num_episodes: 1
  push_to_hub: false

display_data: true
